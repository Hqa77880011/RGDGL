name: Code
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install ".[baselines]"
      - run: python scripts/fetch_baselines.py
      - run: python -m compileall -q rgdgl
      - run: python -c "import rgdgl; import rgdgl.cli"
      - run: pip install pytest
      - run: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m pytest -q tests/test_functional.py tests/test_native_baselines.py
