[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rgdgl"
version = "0.1.0"
description = "Reliability-gated dynamic graph learning implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2", "tables>=3.8", "torch>=2.2", "matplotlib>=3.7", "psutil>=5.9"]
[project.optional-dependencies]
baselines = ["scikit-learn>=1.3", "einops>=0.7", "PyYAML>=6", "tqdm>=4"]
[project.scripts]
rgdgl = "rgdgl.cli:main"
rgdgl-benchmark = "rgdgl.analysis:benchmark"
rgdgl-compare = "rgdgl.analysis:compare"
[tool.setuptools.packages.find]
include = ["rgdgl*"]
